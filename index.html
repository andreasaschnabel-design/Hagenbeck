<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tierpark-Begleiter</title>
  <meta name="description" content="Geführte Rundwege durch den Tierpark mit Karte, Tierlexikon und Vorlesefunktion - offline nutzbar.">
  <meta name="theme-color" content="#1f6f4a">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tierpark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./app/styles.css">
</head>
<body>
  <header class="kopf">
    <button id="zurueck" hidden aria-label="Zurück">‹</button>
    <div class="kopf__titel">Tierpark-Begleiter</div>
    <a href="#/einstellungen" aria-label="Einstellungen" style="text-decoration:none">
      <span style="display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.16)">⚙</span>
    </a>
  </header>

  <main id="inhalt"></main>

  <nav class="nav" aria-label="Hauptnavigation"></nav>

  <noscript>
    <p style="padding:20px">Diese App braucht JavaScript. Bitte im Browser aktivieren.</p>
  </noscript>

  <script type="module" src="./app/app.js"></script>
  <script>
    /* Selbstreparatur: Startet die App nicht (leerer Inhalt nach 3,5 s),
     * liegt meist ein unvollständiger Offline-Cache vor. Dann einmal
     * Cache und Service Worker verwerfen und neu laden; klappt auch das
     * nicht, Hinweis mit Reparatur-Knopf anzeigen. */
    setTimeout(function () {
      var inhalt = document.getElementById('inhalt');
      if (!inhalt || inhalt.childElementCount > 0) return;
      var aufräumen = function () {
        var schritte = [];
        if ('caches' in window) {
          schritte.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker) {
          schritte.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        return Promise.all(schritte);
      };
      if (!sessionStorage.getItem('reparaturversuch')) {
        sessionStorage.setItem('reparaturversuch', '1');
        aufräumen().then(function () { location.reload(); });
      } else {
        inhalt.innerHTML = '<div style="padding:32px 16px;text-align:center">' +
          '<p>Die App konnte nicht vollständig geladen werden.</p>' +
          '<button id="reparieren" style="padding:14px 20px;border:0;border-radius:12px;background:#1f6f4a;color:#fff;font-size:1rem">App reparieren und neu laden</button></div>';
        document.getElementById('reparieren').onclick = function () {
          sessionStorage.removeItem('reparaturversuch');
          aufräumen().then(function () { location.reload(); });
        };
      }
    }, 3500);
  </script>
</body>
</html>
